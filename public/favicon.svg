<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2c878"/>
      <stop offset="50%" stop-color="#c9a54e"/>
      <stop offset="100%" stop-color="#9a7d42"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>
  <!-- Crown base band -->
  <rect x="8" y="34" width="32" height="6" rx="2" fill="url(#gold)"/>
  <!-- Crown body -->
  <path d="M8 34 L4 16 L14 24 L24 8 L34 24 L44 16 L40 34Z" fill="url(#gold)" stroke="#9a7d42" stroke-width="1"/>
  <!-- Crown point gems -->
  <circle cx="4" cy="15" r="3" fill="url(#gem)"/>
  <circle cx="24" cy="7" r="3.5" fill="url(#gem)"/>
  <circle cx="44" cy="15" r="3" fill="url(#gem)"/>
  <!-- Crown band detail -->
  <rect x="8" y="34" width="32" height="2" rx="1" fill="#9a7d42" opacity="0.5"/>
  <!-- Inner jewels on band -->
  <circle cx="16" cy="37" r="1.5" fill="url(#gem)" opacity="0.8"/>
  <circle cx="24" cy="37" r="1.5" fill="url(#gem)" opacity="0.8"/>
  <circle cx="32" cy="37" r="1.5" fill="url(#gem)" opacity="0.8"/>
  <!-- Bottom band -->
  <rect x="10" y="40" width="28" height="3" rx="1.5" fill="#9a7d42"/>
</svg>
